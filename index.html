<!doctype html>
<html lang="es" class="bg-slate-50 dark:bg-slate-900">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual" />
  <!-- v1.2.0: theme-color cian de marca #01696f (antes emerald #10B981) -->
  <meta name="theme-color" content="#01696f" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description"
    content="Sistema de gestión de inventario y punto de venta para bodegas y negocios en Venezuela. Precios actualizados con tasas BCV en tiempo real." />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Precios Al Día — Bodegas" />
  <meta property="og:description"
    content="Gestión de inventario, punto de venta y precios actualizados con tasas BCV en tiempo real para bodegas y negocios en Venezuela." />
  <meta property="og:image" content="/pwa-512x512.png" />
  <meta property="og:locale" content="es_VE" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Precios Al Día — Bodegas" />
  <meta name="twitter:description"
    content="Gestión de inventario, punto de venta y precios actualizados con tasas BCV en tiempo real." />
  <meta name="twitter:image" content="/pwa-512x512.png" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PreciosAlDía" />
  <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <title>Precios Al Día | Bodegas</title>

  <!-- v1.2.0: Fonts del design system — Instrument Serif (display) + Work Sans (body) + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&family=DM+Mono:wght@400;500&family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap"
    rel="stylesheet">

  <!-- Capturar prompt de instalación PWA desde el inicio -->
  <script>
    window.deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.deferredInstallPrompt = e;
    });
  </script>

  <!-- Anti-FOUC: aplicar tema antes del render para evitar flash de tema incorrecto -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme') || 'light';
        // Respetar prefers-color-scheme si no hay preferencia guardada
        if (!localStorage.getItem('theme')) {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'dark') document.documentElement.classList.add('dark');
        // Actualizar theme-color meta según tema
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', t === 'dark' ? '#1a1917' : '#01696f');
      } catch (e) { /* no-op: localStorage puede estar bloqueado */ }
    })();
  </script>
</head>

  <!-- Native HTML Initial Splash Background & Mobile Icon (First Paint - 0ms Delay) -->
  <div id="initial-splash-overlay" style="position:fixed;inset:0;z-index:99999;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.25s ease;padding:16px;box-sizing:border-box;">
    <!-- Icono estático responsive de marca cargado a 0ms SOLO en dispositivos móviles (< 768px) -->
    <div id="mobile-splash-logo" style="display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:min(320px, 62vw);max-height:45vh;">
      <svg style="width:100%;height:auto;max-height:45vh;" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="initTeal" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#01696f" />
            <stop offset="100%" stop-color="#004D53" />
          </linearGradient>
        </defs>
        <path d="M 90 70 H 250 A 180 180 0 0 1 250 430 H 90 V 70 Z M 250 390 A 140 140 0 1 0 250 110 A 140 140 0 0 0 250 390 Z" fill="url(#initTeal)" fill-rule="evenodd" />
        <rect x="168" y="305" width="36" height="85" rx="3" fill="url(#initTeal)" />
        <rect x="228" y="225" width="36" height="165" rx="3" fill="url(#initTeal)" />
        <rect x="288" y="195" width="36" height="195" rx="3" fill="url(#initTeal)" />
        <path d="M 306 128 L 352 205 H 260 Z" fill="url(#initTeal)" />
      </svg>
    </div>
  </div>
  <script>
    (function() {
      try {
        var t = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var splash = document.getElementById('initial-splash-overlay');
        if (splash && t === 'dark') { splash.style.background = '#1a1917'; }

        // Activar el logo de 0ms ÚNICAMENTE en pantallas móviles (< 768px)
        if (window.innerWidth < 768) {
          var mobileLogo = document.getElementById('mobile-splash-logo');
          if (mobileLogo) mobileLogo.style.display = 'flex';
        }
      } catch(e) {}
    })();
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
